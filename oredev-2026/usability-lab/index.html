<style>
:root{--el-red:#B9132F;--el-red-dark:#8F0E24;--el-red-tint:#F6E7EA;--el-slate:#34495D;--el-grayblue:#6B7A80;--el-ink:#1A1A1A;--el-line:#D1D3D4;--el-paper:#fff;--el-bg:#F4F5F6;--el-link:#259B7F;--amber:#E67E20;--amber-tint:#FCEFE0;

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--el-ink);background:var(--el-bg);font-size:15px;line-height:1.5;overflow:hidden}

p{margin:.4em 0}a{color:var(--el-link)}b{font-weight:700}

.muted{color:var(--el-grayblue);font-size:.88rem}.hint{color:var(--el-grayblue);font-size:.82rem;margin:6px 0}.warn-t{color:var(--amber)}
.top{height:52px;background:#fff;border-bottom:1px solid var(--el-line);display:flex;align-items:center;gap:16px;padding:0 20px}
.logo{height:24px;display:block}.prod{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--el-slate);font-weight:500;border-left:1px solid var(--el-line);padding-left:14px}
.tabs{display:flex;gap:2px;margin-left:10px}.tab{background:none;border:0;padding:16px 12px 13px;font:inherit;font-weight:500;color:var(--el-grayblue);cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:var(--el-ink)}.tab.on{color:var(--el-ink);border-bottom-color:var(--el-red)}
.langs{display:flex;gap:4px;margin-left:auto}.langs button{font:500 .72rem var(--mono);border:1px solid var(--el-line);background:#fff;border-radius:999px;padding:3px 9px;cursor:pointer;color:var(--el-grayblue)}.langs button.on{background:var(--el-slate);color:#fff;border-color:var(--el-slate)}
#main{height:calc(100vh - 52px)}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--el-line);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(185,19,47,.25);border-color:var(--el-red)}
textarea{resize:vertical}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--el-red)}

.btn:hover{border-color:var(--el-red);color:var(--el-red)}.btn.red{background:var(--el-red);border-color:var(--el-red);color:#fff}.btn.red:hover{background:var(--el-red-dark);color:#fff}
.btn.ghost{background:transparent}.btn.sm{padding:4px 11px;font-size:.8rem}.btn.big{padding:11px 22px;font-size:1rem}.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row.wrap{flex-wrap:wrap}
.chk{display:flex;gap:7px;align-items:center;font-size:.9rem;cursor:pointer}
label.f{display:block;font-size:.78rem;color:var(--el-slate);font-weight:500;margin:12px 0 4px}
.g2,.g3,.g4,.g5{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g5{grid-template-columns:70px 70px 1fr 1fr 130px}
.chip{display:inline-block;font:500 .7rem var(--mono);padding:2px 8px;border-radius:999px;background:var(--el-bg);border:1px solid var(--el-line);color:var(--el-slate);margin-left:4px;cursor:default}
.chip.ok{background:#E3F4EF;border-color:#259B7F;color:#1d7a63}.chip.warn{background:var(--amber-tint);border-color:var(--amber);color:#b35d0f}.chip.btn{cursor:pointer;padding:6px 12px;font-size:.78rem;margin:0}.chip.on{background:var(--el-red);color:#fff;border-color:var(--el-red)}
/* builder */
.setup{display:grid;grid-template-columns:320px 1fr;height:100%}
.side{background:#fff;border-right:1px solid var(--el-line);overflow:auto;display:flex;flex-direction:column}
.side-h{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--el-grayblue);font-weight:500;padding:14px 16px 6px}
.side-f{margin-top:auto;padding:12px 16px;border-top:1px solid var(--el-line);background:#fff;position:sticky;bottom:0}
.ti{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid #eef0f1;cursor:pointer;align-items:center}.ti:hover{background:#fafafb}.ti.on{background:var(--el-red-tint)}
.ix{font-weight:900;color:var(--el-red);min-width:20px}.tit{flex:1;min-width:0}.tit b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.tit small{display:block;color:var(--el-grayblue);font-size:.74rem}
.mv{display:none;gap:2px}.ti:hover .mv{display:flex}.mv button{border:0;background:none;cursor:pointer;color:var(--el-grayblue);padding:2px 5px;font-size:.85rem}.mv button:hover{color:var(--el-red)}
.ed{overflow:auto;padding:26px 34px;background:var(--el-bg)}.ed-in{max-width:960px;margin:0 auto}
.card{background:#fff;border:1px solid var(--el-line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.qcard{border:1px solid var(--el-line);border-radius:10px;padding:12px;margin-bottom:10px;background:#FAFAFB}.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}.qh select{width:auto}
ol.el,ul.el{list-style:none;padding:0;margin:.5em 0;counter-reset:el}ol.el>li,ul.el>li{position:relative;padding-left:1.8rem;margin:.35em 0;counter-increment:el}
ol.el>li::before{content:counter(el)".";position:absolute;left:0;color:var(--el-red);font-weight:700}ul.el>li::before{content:"–";position:absolute;left:0;color:var(--el-red);font-weight:700}
.hsimg{position:relative;border:1px solid var(--el-line);border-radius:8px;overflow:hidden;cursor:crosshair;user-select:none;margin:6px 0}.hsimg img{display:block;width:100%}
.hsov{position:absolute;inset:0}.hs{position:absolute;border:2px dashed var(--el-grayblue);background:rgba(107,122,128,.15)}.hs.tg{border:2px solid var(--el-link);background:rgba(37,155,127,.18)}.hs.tmp{border-color:var(--el-red);background:rgba(185,19,47,.15)}
.hs span{position:absolute;top:-1px;left:-1px;background:var(--el-slate);color:#fff;font:700 .7rem var(--mono);padding:0 5px}.hsrow{display:flex;gap:8px;align-items:center;margin:4px 0}
.mbg{position:fixed;inset:0;background:rgba(26,26,26,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:640px;width:92%;max-height:88vh;overflow:auto}.modal.big{max-width:1200px;width:94vw;height:86vh;padding:0;display:flex}
.pv{display:flex;flex-direction:column;width:100%}.pv-h{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--el-line)}.pv-b{flex:1;display:grid;grid-template-columns:1fr 320px;min-height:0}
.pv-log{border-left:1px solid var(--el-line);padding:12px;overflow:auto;background:#FAFAFB}.lg{font:.72rem var(--mono);padding:3px 0;border-bottom:1px solid #eee;word-break:break-all}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:var(--el-ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.on{opacity:1;transform:translate(-50%,0)}
/* stage */
.stage{position:relative;background:#E9EBEC;overflow:auto;min-width:0;min-height:0}.stage iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.stagemsg{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--el-grayblue);padding:40px;font-size:1.15rem;white-space:pre-wrap}.stagemsg>div{max-width:560px}
.imgwrap{min-height:100%;background:#fff}.shot{display:block;width:100%;cursor:default;user-select:none}
.treewrap{height:100%;display:flex;align-items:flex-start;justify-content:center;padding:36px;overflow:auto}
.treecard{background:#fff;border:1px solid var(--el-line);border-radius:12px;width:520px;max-width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06)}.treehd{padding:12px 16px;border-bottom:1px solid var(--el-line);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--el-slate);font-weight:500}
.tn{padding:8px 16px;cursor:pointer;border-bottom:1px solid #f0f1f2}.tn:hover{background:#fafafb}.tn.sel{background:var(--el-red-tint)}.car{display:inline-block;width:20px;color:var(--el-red)}
.treebar{padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--el-line);min-height:56px}
/* run */
.top.slim .tabs,.top.slim .langs{display:none}
.run{display:grid;grid-template-columns:1fr 340px;height:100%}.run.left{grid-template-columns:340px 1fr}.run.left .panel{order:-1;border-left:0;border-right:1px solid var(--el-line)}
.run.coll{grid-template-columns:1fr 46px}.run.left.coll{grid-template-columns:46px 1fr}.run.coll .p-body,.run.coll .p-foot,.run.coll .prog,.run.coll .rec span{display:none}.run.coll .p-top{flex-direction:column;padding:8px 4px}.run.coll .p-top span[style]{display:none}
.panel{background:#fff;border-left:1px solid var(--el-line);display:flex;flex-direction:column;min-height:0;min-width:0;font-size:.9rem}
.p-top{display:flex;align-items:center;gap:4px;padding:8px 12px}.rec{font:500 .78rem var(--mono);color:var(--el-grayblue)}.rec.on{color:var(--el-red)}
.ib{border:0;background:none;cursor:pointer;color:var(--el-grayblue);font-size:.95rem;padding:3px 6px;border-radius:6px}.ib:hover{background:var(--el-bg);color:var(--el-red)}
.prog{height:3px;background:var(--el-bg)}.prog i{display:block;height:100%;background:var(--el-red);transition:width .4s}
.warnb{background:var(--amber-tint);color:#8a4a0b;padding:8px 12px;font-size:.82rem}
.p-body{flex:1;overflow:auto;padding:16px}.p-body h2{font-size:1.15rem;margin-bottom:.5rem}
.p-foot{border-top:1px solid var(--el-line);padding:10px 12px;background:#FAFAFB}.marks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.p-foot .row{margin:0}
.meter{height:4px;background:var(--el-line);border-radius:3px;margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--el-link);transition:width .08s}.meter.big{height:10px;margin:8px 0}
.brief{background:var(--el-bg);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin:6px 0 12px}
.nudge{display:none;background:var(--el-red-tint);border-radius:8px;padding:8px 12px;margin:8px 0;color:var(--el-red-dark)}.nudge.on{display:block}
.softb{background:var(--amber-tint);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:.85rem;color:#8a4a0b}
.q{margin:14px 0}.qt{font-weight:500;margin-bottom:6px}.scale{display:flex;gap:5px}.sc{flex:1;border:1px solid var(--el-line);background:#fff;border-radius:8px;padding:8px 0;font:inherit;cursor:pointer}.sc:hover{border-color:var(--el-red)}.sc.on{background:var(--el-red);color:#fff;border-color:var(--el-red)}
.sclab{display:flex;justify-content:space-between;color:var(--el-grayblue);font-size:.74rem;margin-top:3px}.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer}
.mx{border:1px solid var(--el-line);border-radius:8px}.mxr{padding:8px 10px;border-bottom:1px solid #eee}.mxr:last-child{border:0}.mxo{display:flex;gap:4px;margin-top:5px}.mxo label{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.64rem;color:var(--el-grayblue);text-align:center;cursor:pointer;gap:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.welcome{height:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px}.wcard{background:#fff;border:1px solid var(--el-line);border-radius:14px;padding:32px;max-width:720px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lead{font-size:1.05rem;color:var(--el-slate)}.recbox{border:1px solid var(--el-line);border-radius:12px;padding:14px 16px;margin-top:16px;background:#FAFAFB}.recbox.ok{border-color:var(--el-link);background:#F1FAF7}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:12px 0 16px}.stat{background:#fff;border:1px solid var(--el-line);border-radius:12px;padding:16px;text-align:center}.stat .num{font-size:2rem;font-weight:900;color:var(--el-red);line-height:1.1}.stat .label{font-size:.78rem;color:var(--el-slate);margin-top:4px}
table.el{width:100%;border-collapse:collapse;background:#fff;font-size:.86rem}table.el th{background:var(--el-red);color:#fff;font-weight:700;text-align:left;padding:8px 10px;white-space:nowrap}table.el td{padding:7px 10px;border:1px solid var(--el-line);vertical-align:top}table.el tr:nth-child(even) td{background:#FAFAFB}table.sm{font-size:.8rem}table.el select{padding:3px 6px;width:auto}
.scroll{overflow:auto}.clk{cursor:pointer}.clk:hover td{background:var(--el-red-tint)!important}.det td{background:#fff!important}.det[hidden]{display:none}
.bar{position:relative;height:10px;background:#E9EBEC;border-radius:5px;margin-bottom:3px}.bar i{display:block;height:100%;background:var(--el-red);border-radius:5px}.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--el-slate)}
.vd{font:700 .72rem var(--mono);padding:2px 9px;border-radius:999px;white-space:nowrap}.vd.met{background:#E3F4EF;color:#1d7a63}.vd.partial{background:var(--amber-tint);color:#b35d0f}.vd.missed{background:var(--el-red-tint);color:var(--el-red)}.vd.none{background:var(--el-bg);color:var(--el-grayblue)}
@media(max-width:900px){.setup{grid-template-columns:1fr}.run{grid-template-columns:1fr 300px}}
/* v2: primary = filled green (EL link green), destructive = plain red */
:root{--primary:#259B7F;--primary-dark:#1d7a63}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.btn.danger{background:#fff;color:var(--el-red);border-color:var(--el-red)}.btn.danger:hover{background:var(--el-red-tint);color:var(--el-red-dark);border-color:var(--el-red-dark)}
.chip.on,.sc.on{background:var(--primary);border-color:var(--primary);color:#fff}.sc:hover{border-color:var(--primary)}.prog i{background:var(--primary)}
.ib.dg,.mv button.dg{color:var(--el-red)}.ib.dg:hover,.mv button.dg:hover{background:var(--el-red-tint);color:var(--el-red-dark)}
.req{color:var(--el-red)}.topr{margin-left:auto;display:flex;gap:8px}.top.slim .prod{border-left:1px solid var(--el-line)}
.treebrief{padding:12px 16px;border-bottom:1px solid var(--el-line);background:var(--el-bg);white-space:pre-wrap}
.livebox{height:420px;border:1px solid var(--el-line);border-radius:10px;margin-top:6px}
.ta{background:#E3F4EF;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:.88rem;color:#1d7a63}.ta b{font-weight:900}
.mxleg{font-size:.76rem;color:var(--el-grayblue);margin:2px 0 8px}.mxleg b{color:var(--el-ink)}.mx .scale{margin-top:6px}.mx .sc{padding:6px 0}

/* ---- store-only ZIP writer (no dependencies) ---- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function makeZip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date();const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 files.forEach(f=>{const nm=enc.encode(f.name),data=f.data,crc=crc32(data),len=data.length;
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);lh.setUint32(14,crc,true);lh.setUint32(18,len,true);lh.setUint32(22,len,true);lh.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(lh.buffer),nm,data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);ch.setUint32(16,crc,true);ch.setUint32(20,len,true);ch.setUint32(24,len,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+len;});
 const cs=cen.reduce((a,c)=>a+c.length,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:'application/zip'});}

const mem={};
const DB={db:null,
 async open(){if(this.db)return this.db;const db=await new Promise((res,rej)=>{try{const r=indexedDB.open('lattice-usability-lab',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});this.db=db;return db;},
 async get(k){try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return mem[k];}},
 async set(k,v){mem[k]=v;try{const db=await this.open();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}};

function latticeProbe(){
 if(window.__latticeProbe)return;window.__latticeProbe=1;
 var par=window.parent!==window?window.parent:window.opener;if(!par)return;
 function send(m){m.__lattice=1;m.url=location.href;try{par.postMessage(m,'*');}catch(e){}}
 var INT='a,button,input,select,textarea,summary,label,[role=button],[role=tab],[role=menuitem],[role=link],[role=checkbox],[role=option],[onclick],[tabindex],[data-lattice-interactive]';
 function desc(e){if(!e||!e.tagName)return{};var t='';try{t=e.getAttribute('aria-label')||e.innerText||e.value||e.title||e.alt||'';}catch(x){}
  t=String(t).replace(/\s+/g,' ').trim().slice(0,60);var p=[],n=e,i=0;
  while(n&&n.nodeType===1&&i<4){var s=n.tagName.toLowerCase();if(n.id)s+='#'+n.id;else if(n.getAttribute&&n.getAttribute('data-testid'))s+='['+n.getAttribute('data-testid')+']';p.unshift(s);n=n.parentElement;i++;}
  return{tag:e.tagName.toLowerCase(),id:e.id||'',testid:(e.getAttribute&&e.getAttribute('data-testid'))||'',text:t,path:p.join('>')};}
 var lm=0,ls=0;
 addEventListener('click',function(e){var t=e.target,i=false;try{i=!!(t.closest&&t.closest(INT));}catch(x){}send({type:'click',x:e.clientX,y:e.clientY,w:innerWidth,h:innerHeight,interactive:i,el:desc(t),btn:e.button});},true);
 addEventListener('mousemove',function(e){var n=Date.now();if(n-lm<100)return;lm=n;send({type:'move',x:e.clientX,y:e.clientY,w:innerWidth,h:innerHeight});},true);
 addEventListener('scroll',function(){var n=Date.now();if(n-ls<400)return;ls=n;send({type:'scroll'});},true);
 addEventListener('keydown',function(e){send({type:'key',k:e.key&&e.key.length===1?'char':e.key,mod:!!(e.ctrlKey||e.metaKey||e.altKey)});},true);
 function nav(){send({type:'nav',hash:location.hash});}
 addEventListener('hashchange',nav);addEventListener('popstate',nav);
 ['pushState','replaceState'].forEach(function(k){var o=history[k];history[k]=function(){var r=o.apply(this,arguments);nav();return r;};});
 addEventListener('error',function(e){send({type:'jserror',msg:String(e.message||'').slice(0,160)});});
 addEventListener('unhandledrejection',function(e){send({type:'jserror',msg:String((e.reason&&e.reason.message)||e.reason||'').slice(0,160)});});
 var FL='[role=alert],[role=alertdialog],[aria-live=assertive],.error,.toast,.snackbar,.notification,[data-lattice-flag]';
 try{new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType!==1)return;var h=null;try{h=n.matches(FL)?n:n.querySelector(FL);}catch(x){}
  if(h)send({type:'flag',text:String(h.innerText||h.textContent||'').replace(/\s+/g,' ').trim().slice(0,160),el:desc(h)});});});}).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}
 window.latticeEvent=function(name,data){send({type:'custom',name:String(name),data:data});};
 send({type:'hello',title:document.title,w:innerWidth,h:innerHeight});
}

  const a=P(e),tmp=el('div','hs tmp');ov.appendChild(tmp);
  const mv=ev=>{const b=P(ev);Object.assign(tmp.style,{left:Math.min(a.x,b.x)*100+'%',top:Math.min(a.y,b.y)*100+'%',width:Math.abs(b.x-a.x)*100+'%',height:Math.abs(b.y-a.y)*100+'%'});};
  const up=ev=>{document.removeEventListener('mousemove',mv);const b=P(ev);tmp.remove();const w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
   if(w>.008&&h>.008){tk.hotspots.push({id:uid('h'),label:'Area '+(tk.hotspots.length+1),x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w,h,target:true});saveSc();draw();}};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up,{once:true});e.preventDefault();});
 draw();
}

function setupClick(e){
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,i=+a.dataset.i,tasks=S.sc.tasks;
 const refresh=()=>{saveSc();renderList();renderEditor();};
 switch(act){
  case'sel':S.sel=i;renderList();renderEditor();$('.ed').scrollTop=0;break;
  case'up':case'down':{const j=act==='up'?i-1:i+1;if(j<0||j>=tasks.length)break;[tasks[i],tasks[j]]=[tasks[j],tasks[i]];if(S.sel===i)S.sel=j;else if(S.sel===j)S.sel=i;refresh();break;}
  case'add':{const k=a.dataset.k;const tk=k==='tree'?mkTask({kind:'tree',title:t('new_tree'),tree:{text:TREE_SEED},questions:[QT.seq()]}):k==='questions'?mkTask({kind:'questions',title:t('new_q'),questions:[QT.text()]}):mkTask({title:t('new_task'),questions:[QT.seq()]});tasks.push(tk);S.sel=tasks.length-1;refresh();break;}
  case'dup':{const c=clone(tasks[S.sel]);c.id=uid('t');c.title+=' (copy)';c.questions.forEach(q=>q.id=uid('q'));tasks.splice(S.sel+1,0,c);S.sel++;refresh();break;}
  case'del':if(confirm(t('confirm_del'))){tasks.splice(S.sel,1);S.sel=Math.min(S.sel,tasks.length-1);refresh();}break;
  case'qdel':tasks[S.sel].questions.splice(i,1);refresh();break;
  case'qup':case'qdn':{const q=tasks[S.sel].questions,j=act==='qup'?i-1:i+1;if(j<0||j>=q.length)break;[q[i],q[j]]=[q[j],q[i]];refresh();break;}
  case'upl-html':pickFile('.html,.htm',(txt,f)=>{const o=getPath(curObj(),a.dataset.p);o.html=txt;o.name=f.name;refresh();},true);break;
  case'upl-img':pickFile('image/*',(url,f)=>{const o=getPath(curObj(),a.dataset.p);o.image=url;o.name=f.name;if(o.hotspots)o.hotspots=[];refresh();});break;
  case'reload-live':mountLive(curObj());break;
  case'preview':openPreview(tasks[S.sel]);break;
  case'preview-default':openPreview(mkTask({title:S.sc.title,screen:{type:'inherit'}}));break;
  case'exp':dl('scenario.js',textBlob('window.LATTICE_SCENARIO='+JSON.stringify(S.sc)+';','text/javascript'));break;
  case'imp':pickFile('.js,.json',txt=>{try{const o=JSON.parse(txt.replace(/^[^{]*?=\s*/,'').replace(/;\s*$/,''));if(!o||!Array.isArray(o.tasks))throw 0;S.sc=normalizeScenario(o);S.sel=-1;refresh();toast(t('imported'));}catch(x){toast(t('bad_file'));}},true);break;
  case'hadd':{const hs=S.sc.hypotheses=S.sc.hypotheses||[];let n=hs.length+1;while(hs.some(h=>h.id==='H'+n))n++;hs.push({id:'H'+n,statement:''});refresh();break;}
  case'hdel':{const id=S.sc.hypotheses[i].id;S.sc.hypotheses.splice(i,1);tasks.forEach(x=>{if(x.hypId===id)x.hypId='';});refresh();break;}
  case'probe':showProbe();break;
  case'run':preflight();break;
 }
}

function preflightIssues(){
 const out=[];
 S.sc.tasks.forEach((tk,i)=>{const n=`#${i+1} ${tk.title}`;
  if(tk.kind==='task'){const s=resolveScreen(tk);
   if(s.type==='url'&&!s.url)out.push(n+': '+t('i_url'));
   if(s.type==='html'&&!s.html)out.push(n+': '+t('i_html'));
   if(s.type==='image'&&!s.image)out.push(n+': '+t('i_img'));
   if(tk.rule.type==='hotspot'&&!tk.hotspots.some(h=>h.target))out.push(n+': '+t('i_hs'));
   if(['click','nav','event'].includes(tk.rule.type)&&!tk.rule.match)out.push(n+': '+t('i_match'));
   if(tk.rule.type==='answer'&&!tk.questions.some(q=>q.type==='choice'&&parseLines(q.optsText).some(o=>o.correct)))out.push(n+': '+t('i_answer'));}
  if(tk.kind==='tree'&&!treeNodes(parseTree(tk.tree.text)).some(x=>x.correct))out.push(n+': '+t('i_tree'));
  if(!tk.title)out.push(n+': '+t('i_title'));});
 return out;
}
function preflight(){
 if(!S.sc.tasks.length){toast(t('no_tasks'));return;}
 const iss=preflightIssues();
 if(!iss.length)return openTester();
 const m=modal(`<h2>${esc(t('pf_title'))}</h2><ul class="el">${iss.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="row"><button class="btn" data-close>${esc(t('pf_fix'))}</button><button class="btn primary" id="pfgo">${esc(t('pf_go'))}</button></div>`);
 $('#pfgo',m).onclick=()=>{m.close();openTester();};
}

async function startRecording(){

  const disp=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:15},audio:false,preferCurrentTab:true,selfBrowserSurface:'include'});
  let mic=null;try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}catch(e){R.micErr=e.name;}
  const tracks=[...disp.getVideoTracks(),...(mic?mic.getAudioTracks():[])];
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(new MediaStream(tracks),mime?{mimeType:mime,videoBitsPerSecond:2500000}:undefined);
  R.chunks=[];R.mime=mime||'video/webm';
  rec.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data);};
  rec.onstart=()=>{R.recStart=performance.now();};
  disp.getVideoTracks()[0].addEventListener('ended',()=>{if(R.phase!=='finish'){R.recLost=true;ev('rec_stopped_by_user',{});if(R.phase==='welcome')renderWelcome();else renderPanel();}});
  rec.start(1000);R.rec=rec;R.disp=disp;R.mic=mic;if(mic)startMeter(mic);

function startMeter(stream){
 try{const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(stream).connect(an);
  const buf=new Float32Array(an.fftSize);R.meter={ac,an,buf,noise:0.01,speaking:false};
  R.meterTimer=setInterval(()=>{an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];const rms=Math.sqrt(s/buf.length),m=R.meter;
   m.noise=rms<m.noise?rms:m.noise*1.001+0.00001;m.speaking=rms>Math.max(0.02,m.noise*3);
   const b=$('#mtr');if(b)b.style.width=Math.min(100,rms*900)+'%';const b2=$('#mtr2');if(b2)b2.style.width=Math.min(100,rms*900)+'%';
   if(m.speaking&&R.s){R.lastSpeech=nowT();if(R.phase==='doing')R.speechAcc+=100;}},100);}catch(e){}
}
function stopRecording(){
 return new Promise(res=>{const rec=R.rec;clearInterval(R.meterTimer);
  const fin=()=>{R.disp&&R.disp.getTracks().forEach(x=>x.stop());R.mic&&R.mic.getTracks().forEach(x=>x.stop());res(R.chunks.length?new Blob(R.chunks,{type:R.mime||'video/webm'}):null);};
  if(!rec||rec.state==='inactive')return fin();
  rec.onstop=fin;try{rec.stop();}catch(e){fin();}});
}
async function discardRecording(){if(R.rec){R.chunks=[];await stopRecording();}clearInterval(R.tick);}

 else if(x==='next'){const tk=curTask(),qs=tk.kind==='questions'?tk.questions:tk.questions.filter(q=>q.when!=='pre');
  if(qs.some(q=>q.required&&!isAnswered(q)))return;finalizeTask();}
}
/* question widgets: answers live in R.ans so re-rendering never loses them */
function isAnswered(q){const a=R.ans[q.id];if(!a||a.v==null)return false;if(q.type==='text')return String(a.v).trim()!=='';if(q.type==='matrix'){const n=parseLines(q.itemsText).length,v=a.v||[];for(let i=0;i<n;i++)if(v[i]==null)return false;}return true;}
const gate=qs=>qs.some(q=>q.required&&!isAnswered(q))?'disabled':'';
function refreshGate(){const tk=curTask();if(!tk)return;const qs=R.phase==='brief'?tk.questions.filter(q=>q.when==='pre'):tk.kind==='questions'?tk.questions:tk.questions.filter(q=>q.when!=='pre');const b=$('[data-a=start],[data-a=next]');if(b)b.disabled=qs.some(q=>q.required&&!isAnswered(q));}
function qHTML(q){
 const a=R.ans[q.id],v=a?a.v:null;let h=`<div class="q" data-qid="${q.id}"><div class="qt">${esc(q.text)}${q.required?' <span class="req">*</span>':''}</div>`;
 if(q.type==='scale'){const lo=+q.min,hi=+q.max;h+=`<div class="scale">${Array.from({length:hi-lo+1},(_,i)=>`<button class="sc ${v===lo+i?'on':''}" data-sv="${lo+i}">${lo+i}</button>`).join('')}</div><div class="sclab"><span>${esc(q.minLabel)}</span><span>${esc(q.maxLabel)}</span></div>`;}
 else if(q.type==='text')h+=`<textarea rows="3" data-qt="1">${esc(v||'')}</textarea>`;
 else if(q.type==='choice')h+=parseLines(q.optsText).map((o,i)=>`<label class="opt"><input type="radio" name="${q.id}" value="${i}" ${v===i?'checked':''}> ${esc(o.label)}</label>`).join('');
 else if(q.type==='matrix'){const items=parseLines(q.itemsText),ops=parseLines(q.optsText),vv=v||[];
  h+=`<div class="mxleg">${ops.map((o,c)=>`<b>${c+1}</b> ${esc(o.label)}`).join(' &nbsp;&middot;&nbsp; ')}</div><div class="mx">`+items.map((it,r)=>`<div class="mxr"><div>${esc(it.label)}</div><div class="scale">${ops.map((o,c)=>`<button class="sc ${vv[r]===c?'on':''}" data-mr="${r}" data-mv="${c}" title="${esc(o.label)}">${c+1}</button>`).join('')}</div></div>`).join('')+`</div>`;}
 return h+'</div>';
}
function bindQs(root){
 const find=id=>{const tk=curTask();return tk&&tk.questions.find(q=>q.id===id);};
 const set=(q,v,log)=>{const a=R.ans[q.id]=R.ans[q.id]||{};a.v=v;a.t=nowT();if(log)ev('answer',{q:q.text.slice(0,70),v});refreshGate();};
 $$('.q',root).forEach(box=>{const q=find(box.dataset.qid);if(!q)return;
  $$('[data-sv]',box).forEach(b=>b.onclick=()=>{set(q,+b.dataset.sv,true);$$('[data-sv]',box).forEach(x=>x.classList.toggle('on',x===b));});
  const ta=$('[data-qt]',box);if(ta){ta.oninput=()=>set(q,ta.value,false);ta.onchange=()=>ev('answer',{q:q.text.slice(0,70),chars:ta.value.length});}
  $$('input[type=radio]',box).forEach(r=>r.onchange=()=>set(q,+r.value,true));
  $$('[data-mr]',box).forEach(b=>b.onclick=()=>{const cur=((R.ans[q.id]&&R.ans[q.id].v)||[]).slice();cur[+b.dataset.mr]=+b.dataset.mv;set(q,cur,false);$$('[data-mr="'+b.dataset.mr+'"]',box).forEach(x=>x.classList.toggle('on',x===b));});});
}

/* ================= analysis, results & export ================= */
function outcome(s,tid){const r=s.tasks[tid];if(!r||!r.status)return null;if(r.status==='gave_up')return'gave_up';const rv=s.review&&s.review[tid];
 if(rv)return rv==='success'?'success':'failed';if(r.status==='self')return'unreviewed';return r.status;}
const isOk=o=>o==='success'||o==='unreviewed';
const ansBy=(r,metric)=>Object.values(r.answers||{}).find(x=>x.metric===metric&&x.v!=null)||null;
function susScore(a){if(!a||!Array.isArray(a.v)||a.v.length<10)return null;let s=0;for(let i=0;i<10;i++){const v=a.v[i];if(v==null)return null;s+=i%2===0?v:4-v;}return s*2.5;}
const optScore=(a,i)=>{const n=(a.opts||[1,2,3]).length,x=i/Math.max(1,n-1);return /^yes/i.test((a.opts||[])[0]||'')?1-x:x;};
function orientScore(a){if(!a||!Array.isArray(a.v))return null;const v=a.v.filter(x=>x!=null).map(i=>optScore(a,i));return v.length?mean(v):null;}
const included=()=>S.sessions.filter(s=>S.incl[s.id]);
function metaOrder(ss){const m=new Map();ss.forEach(s=>(s.snapshot||[]).forEach(x=>{if(!m.has(x.id))m.set(x.id,x);}));return[...m.values()];}
function verdict(meta,g){const tg=meta.targets||{},c=[];if(tg.success>0&&g.rate!=null)c.push(g.rate*100>=tg.success);if(tg.time>0&&g.medTime!=null)c.push(g.medTime/1000<=tg.time);if(tg.seq>0&&g.seq!=null)c.push(g.seq>=tg.seq);
 if(!c.length||!g.n)return'none';const k=c.filter(Boolean).length;return k===c.length?'met':k===0?'missed':'partial';}
function aggTask(meta,ss){
 const rows=ss.map(s=>({s,r:s.tasks[meta.id]})).filter(x=>x.r&&x.r.status&&x.r.status!=='skipped');
 const outs=rows.map(x=>outcome(x.s,meta.id)),n=rows.length,ok=outs.filter(isOk).length,pick=f=>rows.map(x=>f(x.r)).filter(v=>v!=null&&!isNaN(v));
 const times=pick(r=>r.timeMs),timesOk=rows.filter((x,i)=>isOk(outs[i])&&x.r.timeMs!=null).map(x=>x.r.timeMs);
 const g={meta,rows,outs,n,ok,unrev:outs.filter(o=>o==='unreviewed').length,rate:n?ok/n:null,ci:wilson(ok,n),gaveUp:outs.filter(o=>o==='gave_up').length,failed:outs.filter(o=>o==='failed').length,
  falseDone:rows.filter((x,i)=>x.r.claimedDone&&outs[i]==='failed').length,medTime:median(timesOk.length?timesOk:times),ttfa:median(pick(r=>r.ttfaMs)),
  seq:mean(rows.map(x=>ansBy(x.r,'seq')).filter(Boolean).map(a=>+a.v)),conf:mean(rows.map(x=>ansBy(x.r,'confidence')).filter(Boolean).map(a=>+a.v)),
  clicks:mean(pick(r=>r.clicks)),dead:mean(pick(r=>r.deadClicks)),mis:mean(pick(r=>r.misclicks)),rage:sum(pick(r=>r.rageClicks)),errors:mean(pick(r=>r.errors)),
  pauses:mean(pick(r=>r.pauses)),lost:mean(pick(r=>r.tree&&r.tree.lostness)),speech:mean(pick(r=>r.speechPct)),nudges:mean(pick(r=>r.nudges)),instr:rows.filter(x=>x.r.instrumented).length,
  orient:mean(rows.map(x=>ansBy(x.r,'orient')).map(orientScore).filter(v=>v!=null)),
  fcHit:(()=>{const f=rows.filter(x=>x.r.firstClick);return f.length?f.filter(x=>x.r.firstClick.hit).length/f.length:null;})()};
 g.verdict=verdict(meta,g);return g;
}
function orientWeakest(g){const sc={};g.rows.forEach(x=>{const a=ansBy(x.r,'orient');if(!a||!a.items)return;a.items.forEach((it,i)=>{if(a.v[i]==null)return;(sc[it]=sc[it]||[]).push(optScore(a,a.v[i]));});});
 const e=Object.entries(sc).map(([k,v])=>[k,mean(v)]).sort((a,b)=>a[1]-b[1]);return e.length?e[0]:null;}
function analyse(ss){
 const metas=metaOrder(ss),tasks=metas.filter(m=>m.kind!=='questions').map(m=>aggTask(m,ss));
 const hyps=new Map();tasks.forEach(g=>{const id=g.meta.hypId;if(!id)return;const h=hyps.get(id)||{id,hyp:g.meta.hyp,tasks:[],n:0,ok:0};h.tasks.push(g);h.n+=g.n;h.ok+=g.ok;if(!h.hyp)h.hyp=g.meta.hyp;hyps.set(id,h);});
 hyps.forEach(h=>{const v=h.tasks.map(g=>g.verdict).filter(x=>x!=='none');h.verdict=!v.length?'none':v.every(x=>x==='met')?'met':v.every(x=>x==='missed')?'missed':'partial';h.rate=h.n?h.ok/h.n:null;});
 const sus=ss.map(s=>{for(const r of Object.values(s.tasks)){const a=ansBy(r,'sus');if(a)return susScore(a);}return null;}).filter(v=>v!=null);
 metas.filter(m=>m.kind==='questions'&&m.hypId).forEach(m=>{if(sus.length&&!hyps.has(m.hypId)){const v=mean(sus)>=68?'met':'missed';hyps.set(m.hypId,{id:m.hypId,hyp:m.hyp,tasks:[],n:sus.length,ok:0,verdict:v,rate:null,sus:mean(sus)});}});
 const all=tasks.flatMap(g=>g.rows.map((x,i)=>({o:g.outs[i],r:x.r})));
 return{metas,tasks,hyps:[...hyps.values()],sus,n:ss.length,rate:all.length?all.filter(x=>isOk(x.o)).length/all.length:null,
  medTime:median(all.map(x=>x.r.timeMs).filter(v=>v!=null)),seq:mean(tasks.map(g=>g.seq).filter(v=>v!=null)),speech:mean(tasks.map(g=>g.speech).filter(v=>v!=null))};
}

 const A=analyse(ss),css=`body{font:15px/1.5 Roboto,Segoe UI,Arial,sans-serif;color:#1A1A1A;max-width:1080px;margin:0 auto;padding:32px}h1{font-weight:900;margin:.2em 0}h2{margin-top:2em}.k{text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:#34495D;font-weight:500}table{border-collapse:collapse;width:100%;font-size:.88rem}th{background:#B9132F;color:#fff;text-align:left;padding:8px 10px}td{border:1px solid #D1D3D4;padding:7px 10px;vertical-align:top}tr:nth-child(even) td{background:#FAFAFB}.met{color:#1d7a63;font-weight:700}.partial{color:#E67E20;font-weight:700}.missed{color:#B9132F;font-weight:700}.tiles{display:flex;gap:14px;flex-wrap:wrap}.tile{border:1px solid #D1D3D4;border-radius:12px;padding:14px 20px;min-width:150px}.tile b{display:block;font-size:2rem;font-weight:900;color:#B9132F}.muted{color:#6B7A80;font-size:.85rem}`;

 const hl=A.hyps.map(h=>`<tr><td><b>${esc(h.id)}</b></td><td>${esc(h.hyp||'')}</td><td>${h.sus!=null?'SUS '+num(h.sus,0):pct(h.rate)}</td><td class="${h.verdict}">${esc(vtxt(h.verdict))}</td></tr>`).join('');
 const vb=[];ss.forEach(s=>(s.snapshot||[]).forEach(m=>{const r=s.tasks[m.id];if(!r)return;Object.values(r.answers||{}).forEach(a=>{if(a.type==='text'&&a.v)vb.push(`<tr><td>${esc(s.participant)}</td><td>${esc(m.title)}</td><td>${esc(a.q)}</td><td>${esc(a.v)}</td></tr>`);});}));

 <h2>${esc(t('r_hyps'))}</h2><table><tr><th>#</th><th>${esc(t('f_hyp'))}</th><th>${esc(t('st_success'))}</th><th>${esc(t('c_verdict'))}</th></tr>${hl}</table>
 <h2>${esc(t('r_tasks'))}</h2><table><tr><th>${esc(t('c_task'))}</th><th>n</th><th>${esc(t('st_success'))} (95% CI)</th><th>${esc(t('c_time'))}</th><th>SEQ</th><th>${esc(t('c_pauses'))}</th><th>${esc(t('c_dm'))}</th><th>${esc(t('c_err'))}</th><th>${esc(t('c_lost'))}</th><th>${esc(t('c_verdict'))}</th></tr>${tl}</table>

function resultsBody(A,ss){

 const hy=`<div class="card"><h3>${esc(t('r_hyps'))}</h3><table class="el"><tr><th>#</th><th>${esc(t('f_hyp'))}</th><th>${esc(t('c_tasks'))}</th><th>${esc(t('st_success'))}</th><th>${esc(t('c_verdict'))}</th></tr>${A.hyps.map(h=>`<tr><td><b>${esc(h.id)}</b></td><td>${esc(h.hyp||'')}</td><td>${h.tasks.map(g=>esc(g.meta.title)+(g.meta.variant?' ('+g.meta.variant+')':'')).join('<br>')||'SUS'}</td><td>${h.sus!=null?'SUS '+num(h.sus,0):pct(h.rate)}</td><td>${vchip(h.verdict)}</td></tr>`).join('')||`<tr><td colspan="5">${esc(t('no_hyp'))}</td></tr>`}</table></div>`;
 const tt=`<div class="card"><h3>${esc(t('r_tasks'))}</h3><div class="scroll"><table class="el"><tr><th>${esc(t('c_task'))}</th><th>n</th><th style="width:170px">${esc(t('st_success'))}</th><th>${esc(t('c_time'))}</th><th>${esc(t('c_ttfa'))}</th><th>SEQ</th><th>${esc(t('c_pauses'))}</th><th>${esc(t('c_dm'))}</th><th>${esc(t('c_err'))}</th><th>${esc(t('c_lost'))}</th><th>${esc(t('c_verdict'))}</th></tr>
 ${A.tasks.map((g,i)=>`<tr class="clk" data-ra="tgl" data-i="${i}"><td><b>${i+1}. ${esc(g.meta.title)}</b>${g.meta.variant?` <span class="chip">${esc(g.meta.variant)}</span>`:''}<div class="muted">${esc(g.meta.hypId||'')}${g.unrev?' &middot; <span class="warn-t">'+g.unrev+' '+esc(t('unreviewed'))+'</span>':''}${g.n&&!g.instr&&(g.meta.screen==='url'||g.meta.screen==='html')?' &middot; <span class="warn-t">'+esc(t('no_probe'))+'</span>':''}</div></td><td>${g.n}</td><td>${bar(g.rate,g.meta.targets&&g.meta.targets.success,g.ci)}</td><td>${g.medTime==null?'–':fmtS(g.medTime)}${g.meta.targets&&g.meta.targets.time?`<div class="muted">≤ ${g.meta.targets.time}s</div>`:''}</td><td>${g.ttfa==null?'–':fmtS(g.ttfa)}</td><td>${num(g.seq)}${g.meta.targets&&g.meta.targets.seq?`<div class="muted">≥ ${g.meta.targets.seq}</div>`:''}</td><td>${num(g.pauses)}</td><td>${num(g.dead)} / ${num(g.mis)}</td><td>${num(g.errors)}</td><td>${g.lost==null?'–':num(g.lost,2)}</td><td>${vchip(g.verdict)}</td></tr>
 <tr class="det" id="det${i}" hidden><td colspan="11">${taskDetail(g)}</td></tr>`).join('')}</table></div><div class="hint">${esc(t('r_legend'))}</div></div>`;
 const heat=A.tasks.filter(g=>{const tk=S.sc.tasks.find(x=>x.id===g.meta.id);return tk&&tk.kind==='task'&&resolveScreen(tk).type==='image'&&resolveScreen(tk).image;}).map(g=>`<div class="card"><h3>${esc(t('r_heat'))}: ${esc(g.meta.title)}</h3><div class="hint">${esc(t('heat_hint'))} &middot; ${esc(t('st_fc'))}: ${pct(g.fcHit)}</div><canvas data-heat="${g.meta.id}" style="max-width:100%"></canvas></div>`).join('');
 const vb=[];ss.forEach(s=>(s.snapshot||[]).forEach(m=>{const r=s.tasks[m.id];if(!r)return;Object.values(r.answers||{}).forEach(a=>{if(a.type==='text'&&a.v)vb.push(`<tr><td>${esc(s.participant)}</td><td>${esc(m.title)}</td><td>${esc(a.q)}</td><td>${esc(a.v)}</td></tr>`);});if(r.giveUpReason||r.giveUpNote)vb.push(`<tr><td>${esc(s.participant)}</td><td>${esc(m.title)}</td><td>${esc(t('gave_up_l'))}</td><td>${esc((r.giveUpReason?t(r.giveUpReason)+' ':'')+(r.giveUpNote||''))}</td></tr>`);}));

function taskDetail(g){
 const w=orientWeakest(g);
 return `<div class="scroll"><table class="el sm"><tr><th>${esc(t('c_p'))}</th><th>${esc(t('c_outcome'))}</th><th>${esc(t('c_time'))}</th><th>${esc(t('c_ttfa'))}</th><th>${esc(t('c_clicks'))}</th><th>${esc(t('c_dm'))}</th><th>${esc(t('c_rage'))}</th><th>${esc(t('c_err'))}</th><th>${esc(t('c_pauses'))}</th><th>SEQ</th><th>${esc(t('st_speech'))}</th><th>${esc(t('c_vt'))}</th></tr>
 ${g.rows.map((x,i)=>{const r=x.r,o=g.outs[i],seq=ansBy(r,'seq');const rv=x.s.review&&x.s.review[g.meta.id]||'';
  const oc=r.status==='self'?`<select data-ra="rev" data-sid="${x.s.id}" data-tid="${g.meta.id}"><option value="" ${!rv?'selected':''}>${esc(t('unreviewed'))}</option><option value="success" ${rv==='success'?'selected':''}>${esc(t('o_success'))}</option><option value="fail" ${rv==='fail'?'selected':''}>${esc(t('o_failed'))}</option></select>`:`<span class="vd ${o==='success'?'met':o==='failed'?'missed':'partial'}">${esc(t('o_'+o))}</span>`;
  return `<tr><td>${esc(x.s.participant)}</td><td>${oc}</td><td>${fmtS(r.timeMs)}</td><td>${fmtS(r.ttfaMs)}</td><td>${r.clicks}</td><td>${r.deadClicks} / ${r.misclicks}</td><td>${r.rageClicks}</td><td>${r.errors}</td><td>${r.pauses}</td><td>${seq?seq.v:'–'}</td><td>${r.speechPct==null?'–':pct(r.speechPct)}</td><td>${r.vtStart!=null?`<a href="#" data-ra="seek" data-vt="${r.vtStart}" data-sid="${x.s.id}">${fmtT(r.vtStart)}</a>`:'–'}</td></tr>${r.tree?`<tr><td></td><td colspan="11" class="muted">${esc(t('tree_path'))}: ${esc(r.tree.visits.join(' → '))} &middot; ${esc(t('c_lost'))} ${r.tree.lostness==null?'–':num(r.tree.lostness,2)} &middot; ${esc(t('tree_sel2'))}: <b>${esc(r.tree.selected)}</b></td></tr>`:''}`;}).join('')}</table></div>${w?`<div class="hint">${esc(t('orient_weak'))}: <b>${esc(w[0])}</b> (${pct(w[1])})</div>`:''}${g.meta.successCrit?`<div class="hint">${esc(t('f_crit'))}: ${esc(g.meta.successCrit)}</div>`:''}`;
}
function reviewCard(ss){
 const s=ss.find(x=>x.id===S.focus)||ss[0];if(!s)return'';
 const hasVid=S.blob&&S.blob.id===s.id,types=['note','mark','task_start','task_end','goal','give_up','flag','js_error','nudge','pause','rage_click','soft_limit','rec_stopped_by_user'];
 const f=S.tlf||'obs';const keep=f==='obs'?['note','mark','give_up','task_start']:f==='sys'?['flag','js_error','rage_click','pause','nudge','soft_limit','goal']:types;
 const evs=s.events.filter(e=>keep.includes(e.type));
 const title=id=>{const m=(s.snapshot||[]).find(x=>x.id===id);return m?m.title:''};
 return `<h3>${esc(t('r_review'))}: ${esc(s.participant)}</h3><div class="row wrap"><select id="tlsel">${ss.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.participant)}</option>`).join('')}</select><select id="tlf"><option value="obs" ${f==='obs'?'selected':''}>${esc(t('tl_obs'))}</option><option value="sys" ${f==='sys'?'selected':''}>${esc(t('tl_sys'))}</option><option value="all" ${f==='all'?'selected':''}>${esc(t('tl_all'))}</option></select>${hasVid?`<button class="btn sm" data-ra="vdl" data-sid="${s.id}">${esc(t('x_video'))}</button>`:`<span class="muted">${esc(t('no_video_loaded'))}</span>`}</div>
 ${hasVid?`<video id="rv" controls style="width:100%;max-height:340px;background:#000;border-radius:8px;margin:10px 0"></video>`:''}
 <div class="scroll" style="max-height:360px"><table class="el sm"><tr><th>${esc(t('c_vt'))}</th><th>${esc(t('c_task'))}</th><th>${esc(t('c_event'))}</th><th></th></tr>${evs.map(e=>`<tr><td><a href="#" data-ra="seek" data-vt="${e.vt==null?'':e.vt}" data-sid="${s.id}">${fmtT(e.vt!=null?e.vt:e.t)}</a><div class="muted">${new Date(new Date(s.startedAt).getTime()+e.t).toTimeString().slice(0,8)}</div></td><td>${esc(title(e.task))}</td><td><span class="chip ${e.type==='note'||e.type==='mark'?'':'warn'}">${esc(e.type==='mark'?e.kind:e.type)}</span></td><td>${esc(e.text||(e.type==='flag'?e.text:'')||(e.type==='pause'?fmtS(e.ms):'')||(e.reason||'')||(e.status||''))}</td></tr>`).join('')||'<tr><td colspan="4">–</td></tr>'}</table></div>`;
}
function postResults(A,ss){
 $('#review').innerHTML=reviewCard(ss);
 const rv=$('#rv');if(rv&&S.blob){rv.src=URL.createObjectURL(S.blob.blob);rv.addEventListener('loadedmetadata',()=>{if(rv.duration===Infinity){rv.currentTime=1e101;rv.addEventListener('timeupdate',function f(){rv.removeEventListener('timeupdate',f);rv.currentTime=0;});}});}
 $('#tlsel')&&($('#tlsel').onchange=e=>{S.focus=e.target.value;renderResults();});$('#tlf')&&($('#tlf').onchange=e=>{S.tlf=e.target.value;renderResults();});
 $$('canvas[data-heat]').forEach(cv=>drawHeat(cv,A.tasks.find(g=>g.meta.id===cv.dataset.heat)));
}
function drawHeat(cv,g){
 const tk=S.sc.tasks.find(x=>x.id===g.meta.id),scr=resolveScreen(tk),img=new Image();
 img.onload=()=>{const W=Math.min(760,img.width),H=Math.round(img.height*W/img.width);cv.width=W;cv.height=H;const c=cv.getContext('2d');c.drawImage(img,0,0,W,H);
  c.lineWidth=2;(tk.hotspots||[]).forEach(h=>{c.strokeStyle=h.target?'#259B7F':'#6B7A80';c.setLineDash(h.target?[]:[5,4]);c.strokeRect(h.x*W,h.y*H,h.w*W,h.h*H);c.setLineDash([]);});
  g.rows.forEach(x=>{const p=x.r.path||[];c.strokeStyle='rgba(52,73,93,.22)';c.lineWidth=1.2;c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[1]*W,q[2]*H):c.moveTo(q[1]*W,q[2]*H));c.stroke();
   x.s.events.filter(e=>e.task===g.meta.id&&e.type==='click'&&e.src==='image').forEach(e=>{c.fillStyle='rgba(185,19,47,.55)';c.beginPath();c.arc(e.nx*W,e.ny*H,9,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=1.5;c.stroke();});});};
 img.src=scr.image;
}
async function resultsClick(e){
 const a=e.target.closest('[data-ra]');if(!a)return;const act=a.dataset.ra,ss=included();
 if(act==='incl'){S.incl[a.dataset.id]=a.checked;renderResults();return;}
 if(act==='focus'){if(e.target.tagName==='INPUT')return;S.focus=a.dataset.id;renderResults();return;}
 if(act==='tgl'){const d=$('#det'+a.dataset.i);d.hidden=!d.hidden;return;}
 if(act==='seek'){e.preventDefault();const v=$('#rv'),vt=a.dataset.vt;if(v&&vt!==''){v.currentTime=Math.max(0,vt/1000-2);v.play();v.scrollIntoView({block:'nearest'});}else toast(t('no_video_loaded'));return;}
 if(act==='sdel'){e.stopPropagation();if(confirm(t('confirm_del_s'))){S.sessions=S.sessions.filter(s=>s.id!==a.dataset.id);await DB.set('sessions',S.sessions);renderResults();}return;}
 if(act==='sjson'){e.stopPropagation();const s=S.sessions.find(x=>x.id===a.dataset.id);dl(`session-${s.participant}.json`,textBlob(JSON.stringify(s,null,1),'application/json'));return;}
 if(act==='vdl'){exportVideo(S.sessions.find(x=>x.id===a.dataset.sid));return;}
 if(act==='all'){const all=S.sessions.every(s=>S.incl[s.id]);S.sessions.forEach(s=>S.incl[s.id]=!all);renderResults();return;}
 if(act==='imp'){pickFile('.json',txt=>{try{let o=JSON.parse(txt);o=Array.isArray(o)?o:[o];let n=0;o.forEach(s=>{if(!s||!s.events||!s.tasks)return;if(S.sessions.some(x=>x.id===s.id))s.id=uid('s');S.sessions.push(s);S.incl[s.id]=!s.pilot;n++;});DB.set('sessions',S.sessions);renderResults();toast(n+' '+t('imported_s'));}catch(x){toast(t('bad_file'));}},true);return;}
 if(act==='zip')return exportZip(ss);
 if(act==='json'){if(!ss.length)return toast(t('none_sel'));dl(`sessions-${stamp()}.json`,textBlob(JSON.stringify(ss,null,1),'application/json'));return;}
 if(act==='csvt'){dl(`tasks-${stamp()}.csv`,textBlob(toCSV(taskRows(ss),TCOLS),'text/csv'));return;}
 if(act==='csve'){dl(`events-${stamp()}.csv`,textBlob(toCSV(eventRows(ss),ECOLS),'text/csv'));return;}
 if(act==='rep'){dl(`report-${stamp()}.html`,textBlob(buildReport(ss),'text/html'));return;}
}

const S={view:MODE==='tester'?'run':'setup',sc:null,sel:-1,sessions:[],incl:{},focus:null,blob:null,tlf:'obs'};
const t=(k,...a)=>{let s=I.en[k];if(s==null)s=k;a.forEach((v,i)=>{s=s.replace('{'+i+'}',v);});return s;};
function testerUrl(local){const base=location.protocol==='file:'?location.href.split(/[?#]/)[0]+'?mode=tester':location.origin+location.pathname+'?mode=tester';return local?base+(base.includes('?')?'&':'?')+'local=1':base;}
function normalizeScenario(sc){
 sc.defaultScreen=Object.assign({type:'url',url:'',html:'',image:'',name:''},sc.defaultScreen);
 sc.nudgeSilenceSec=sc.nudgeSilenceSec==null?12:sc.nudgeSilenceSec;
 sc.tasks=(sc.tasks||[]).map(tk=>{const d=mkTask(),o=Object.assign({},d,tk);o.screen=Object.assign({},d.screen,tk.screen);o.rule=Object.assign({},d.rule,tk.rule);o.targets=Object.assign({},d.targets,tk.targets);o.tree=Object.assign({},d.tree,tk.tree);o.hotspots=tk.hotspots||[];o.questions=tk.questions||[];return o;});
 if(!Array.isArray(sc.hypotheses)){const m=new Map();sc.tasks.forEach(tk=>{if(tk.hypId&&!m.has(tk.hypId))m.set(tk.hypId,{id:tk.hypId,statement:tk.hyp||''});});sc.hypotheses=[...m.values()];}
 return sc;
}

document.addEventListener('click',async e=>{
 if(MODE!=='editor')return;
 const tab=e.target.closest('[data-tab]');
 if(tab){const k=tab.dataset.tab;
  if(k==='open'){preflight();return;}
  if(k==='copy'){try{await navigator.clipboard.writeText(testerUrl(false));toast(t('copied'));}catch(x){prompt(t('share_link'),testerUrl(false));}return;}
  if(k==='results'){const ss=await DB.get('sessions');if(Array.isArray(ss)){ss.forEach(s=>{if(!(s.id in S.incl))S.incl[s.id]=!s.pilot;});S.sessions=ss;}}
  S.view=k;render();return;}
 if(S.view==='setup')setupClick(e);else resultsClick(e);
});
function loadRemoteScenario(){return new Promise(res=>{const sc=document.createElement('script');sc.src='scenario.js?'+Date.now();sc.onload=()=>{const o=window.LATTICE_SCENARIO;res(o&&Array.isArray(o.tasks)?o:null);};sc.onerror=()=>res(null);document.head.appendChild(sc);});}
(async function boot(){
 R=runDefaults();
 let sc=null;
 if(MODE==='tester'&&QS.get('local')!=='1')sc=await loadRemoteScenario();
 if(!sc){const l=await DB.get('scenario');if(l&&Array.isArray(l.tasks))sc=l;}
 if(!sc||(sc.seedV||0)<5)sc=seedScenario();
 S.sc=sc?normalizeScenario(sc):null;
 const ss=await DB.get('sessions');S.sessions=Array.isArray(ss)?ss:[];S.sessions.forEach(s=>{S.incl[s.id]=!s.pilot;});
 if(MODE==='tester')startWelcome();else render();
})();
